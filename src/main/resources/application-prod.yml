spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create # 개발 중에는 update, 나중에 validate로 변경
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  cloud:
    aws:
      credentials:
        access-key: ${AWS_S3_ACCESS_KEY}
        secret-key: ${AWS_S3_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET_NAME}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.everybuddy: info
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET}
  tokenValidityInMilliseconds: ${JWT_VALIDITY}
  refreshTokenValidityInMilliseconds: ${JWT_REFRESH_VALIDITY}
  tempTokenValidityInMilliseconds: ${JWT_TEMP_VALIDITY}

google:
  client-id: ${GOOGLE_CLIENT_ID}

firebase:
  project:
    id: ${FIREBASE_PROJECT_ID}
  database:
    url: ${FIREBASE_DATABASE_URL}
  credentials:
    path: ${FIREBASE_FILE_PATH}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
swagger:
  server-url: ${SERVER_URL}

triton:
  base-url: ${TRITON_BASE_URL}
