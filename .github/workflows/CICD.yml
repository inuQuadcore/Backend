name: EveryBuddy server CI & CD

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up gradlew executable permission
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build with Gradle
        run: ./gradlew build

      # PR 이벤트인 경우 (빌드까지만 수행하고 Docker Push는 건너뜀)
      - name: Skip Docker Push on PR
        if: github.event_name == 'pull_request'
        run: echo "코드 정적 분석을 위해 Docker Hub 푸시를 건너뜁니다."

      # docker cashe 기능을 사용하기 위해 빌더를 명시적으로 생성
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # main 브랜치에 Push 된 경우에만 Docker Hub에 Login
      - name: Docker Login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Tag Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/everybuddy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build_and_push
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # docker-compose.yml을 Bastion 경유 → Private EC2에 전송
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_BASTION_HOST }}
          proxy_username: ${{ secrets.EC2_USERNAME }}
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/everybuddy"

      - name: Create Firebase credentials file
        env:
          FIREBASE_ADMIN_KEY: ${{ secrets.FIREBASE_ADMIN_KEY }}
        run: |
          cat << EOF > firebase-adminsdk.json
          $FIREBASE_ADMIN_KEY
          EOF

      # Firebase 인증 파일을 Bastion 경유 → Private EC2에 전송
      - name: Copy Firebase credentials to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_BASTION_HOST }}
          proxy_username: ${{ secrets.EC2_USERNAME }}
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          source: "firebase-adminsdk.json"
          target: "~/everybuddy"

      # Bastion 경유 → Private EC2에 SSH 접속 후 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          RDS_USERNAME: ${{ secrets.RDS_USERNAME }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          AWS_S3_ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY }}
          AWS_S3_SECRET_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_VALIDITY: ${{ secrets.JWT_VALIDITY }}
          JWT_REFRESH_VALIDITY: ${{secrets.JWT_REFRESH_VALIDITY}}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_FILE_PATH: ${{ secrets.FIREBASE_FILE_PATH }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_BASTION_HOST }}
          proxy_username: ${{ secrets.EC2_USERNAME }}
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,RDS_USERNAME,RDS_PASSWORD,AWS_S3_ACCESS_KEY,AWS_S3_SECRET_KEY,AWS_S3_BUCKET_NAME,JWT_SECRET,JWT_VALIDITY,JWT_REFRESH_VALIDITY,FIREBASE_PROJECT_ID,FIREBASE_DATABASE_URL,FIREBASE_FILE_PATH,SERVER_URL
          script: |
            cd ~/everybuddy
            export DOCKER_USERNAME=$DOCKER_USERNAME
            export RDS_USERNAME=$RDS_USERNAME
            export RDS_PASSWORD=$RDS_PASSWORD
            export AWS_S3_ACCESS_KEY=$AWS_S3_ACCESS_KEY
            export AWS_S3_SECRET_KEY=$AWS_S3_SECRET_KEY
            export AWS_S3_BUCKET_NAME=$AWS_S3_BUCKET_NAME
            export JWT_SECRET=$JWT_SECRET
            export JWT_VALIDITY=$JWT_VALIDITY
            export JWT_REFRESH_VALIDITY=$JWT_REFRESH_VALIDITY
            export FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID
            export FIREBASE_DATABASE_URL=$FIREBASE_DATABASE_URL
            export FIREBASE_FILE_PATH=$FIREBASE_FILE_PATH
            export SERVER_URL=$SERVER_URL

            docker pull $DOCKER_USERNAME/everybuddy:latest
            docker compose down
            docker compose up -d
            docker image prune -f
